description: 'OneCard is a mobile-first metal credit card from India''s FPL Technologies, a fintech
  unicorn that reimagines credit and payments with full-stack, in-house technology. OneCard is issued
  in partnership with banks including Bank of Baroda, CSB Bank, Federal Bank, SBM Bank, South Indian
  Bank and Indian Bank, and emphasizes simplicity, transparency and giving control back to the user.
  FPL Technologies also operates OneScore (credit-score monitoring) and Wizely (savings). Backed by
  QED Investors, OneCard is a consumer-facing product; as of this profile it publishes no public
  developer API, developer portal, or API documentation surface.'
